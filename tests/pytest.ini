[pytest]
# 只收集 tests/ 目录，避免根目录 test_*.py 被误扫
testpaths = tests

# 默认跳过需要外部服务/凭据的测试；PR 门禁仍使用显式快速测试清单。
addopts = -m "not integration and not external" -k "not (test_server_config or test_stock_codes)"

# 标记定义，避免警告
markers =
    integration: 标记集成/端到端测试（默认跳过）
    external: 需要实时 API、MongoDB、Redis、凭据、已启动服务或人工观察（默认跳过）
