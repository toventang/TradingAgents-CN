name: Jules Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run setup script
        run: bash scripts/jules/setup.sh

      - name: Verify imports
        run: bash scripts/jules/verify.sh imports

      - name: Run fast backend tests
        run: bash scripts/jules/verify.sh backend

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile || yarn --cwd frontend install

      - name: Verify frontend
        run: bash scripts/jules/verify.sh frontend
