name: Jules quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Validate imports
        run: bash scripts/jules/verify.sh imports
      - name: Run deterministic Python smoke tests
        run: bash scripts/jules/verify.sh fast

  frontend-type-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable Yarn classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Type-check and build frontend
        run: bash scripts/jules/verify.sh frontend
