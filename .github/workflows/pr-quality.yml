name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Run Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Jules environment setup
        run: |
          bash scripts/jules/setup.sh

      - name: Import validation
        run: |
          bash scripts/jules/verify.sh imports

      - name: Backend unit tests
        run: |
          bash scripts/jules/verify.sh backend

      - name: Frontend type-check and build
        run: |
          bash scripts/jules/verify.sh frontend
